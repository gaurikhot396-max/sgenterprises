<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#7367f0,#5e50ee);
    font-family: Inter, sans-serif;
}

.forgot-card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 25px 60px rgba(0,0,0,0.15);
}

.auth-title{
    text-align:center;
    margin-bottom:25px;
}

.auth-title h2{
    margin-bottom:8px;
}

.auth-title p{
    font-size:14px;
    color:#6e6b7b;
}

.input-group{
    margin-bottom:22px;
}

.input-group input{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

.input-group input:focus{
    outline:none;
    border-color:#7367f0;
    box-shadow:0 0 0 3px rgba(115,103,240,0.12);
}

.btn-auth{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#7367f0;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.btn-auth:hover{
    background:#5e50ee;
}

.auth-footer{
    text-align:center;
    margin-top:22px;
}

.auth-footer a{
    color:#7367f0;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="forgot-card">

<div class="auth-title">
<h2>Forgot Password?</h2>
<p>Enter your email to reset password</p>
</div>

<form method="POST">

<div class="input-group">
<input type="email" name="email" placeholder="Enter Email" required>
</div>

<button class="btn-auth" type="submit">
Send Reset Link
</button>

</form>

<div class="auth-footer">
<a href="{{ url_for('auth.login') }}">
Back to Login
</a>
</div>

</div>

</body>
</html>
