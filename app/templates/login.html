<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg,#7367f0,#5e50ee);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Login Card */

.login-card{
    width:320px;
    background:white;
    padding:40px;
    border-radius:0px;
    box-shadow:0 20px 60px rgba(0,0,0,0.12);
}

/* Logo */

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
  
    margin-bottom:25px;
}

.logo img{
    width:100px;
}

.logo span{
    font-size:36px;
    font-weight:600;
    color:#7367f0;
}

/* Welcome */

.welcome{
    text-align:center;
    margin-bottom:25px;
}

.welcome h3{
    margin-bottom:6px;
}

.welcome p{
    font-size:12px;
    color:#6e6b7b;
}

/* Input */

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    font-size:14px;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #d8d6de;
    transition:0.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#7367f0;
}

/* Button */

.btn-login{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#7367f0;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

.btn-login:hover{
    background:#5e50ee;
}

/* Extra */

.extra{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:20px;
}

.extra a{
    color:#7367f0;
    text-decoration:none;
}

.extra a:hover{
    text-decoration:underline;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.footer a{
    color:#7367f0;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
<img src="{{ url_for('static', filename='images/sglogomain.png') }}">

</div>

<div class="welcome">
<h3>Welcome to Platominds!👋</h3>
<label>Please sign-in to your account and start the adventure</label>
</div>

<form method="POST">

<div class="input-group">
<label>Username</label>
<input type="text" name="username" required>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" required>
</div>

<div class="extra">
<div>
<input type="checkbox" name="remember"> Remember Me
</div>

<div>
<a href="{{ url_for('auth.forgot_password') }}">
Forgot Password?
</a>
</div>
</div>

<button class="btn-login" type="submit">
Login
</button>

</form>

<div class="footer">
Don't have account?
<a href="{{ url_for('auth.register_page') }}">
Create Account
</a>
</div>

</div>

</body>
</html>
