<!DOCTYPE html>
<html>
<head>
<title>Enquiry Sources</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    padding:30px;
}

.container{
    background:white;
    padding:20px;
    border-radius:8px;
}

.header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.btn{
    padding:8px 14px;
    background:#7367f0;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f0f0f0;
}

.status-active{
    color:green;
}

.status-inactive{
    color:red;
}

.action-btn{
    padding:5px 10px;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

.edit{
    background:#28c76f;
    color:white;
}

.delete{
    background:#ea5455;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>Enquiry Sources</h2>

<input type="text" placeholder="Search Follow-up">
</div>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Description</th>
<th>Status</th>
<th>Sort Order</th>
<th>Actions</th>
</tr>

{% for source in sources %}

<tr>

<td>{{source.id}}</td>

<td>{{source.name}}</td>

<td>{{source.description}}</td>

<td>
{% if source.status == "Active" %}
<span class="status-active">Active</span>
{% else %}
<span class="status-inactive">Inactive</span>
{% endif %}
</td>

<td>{{source.sort_order}}</td>

<td>

<button class="action-btn edit">Edit</button>

<button class="action-btn delete">Delete</button>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
