<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#7367f0,#5e50ee);
    font-family: Inter, sans-serif;
}

.register-card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 25px 60px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

.input-group input:focus{
    outline:none;
    border-color:#7367f0;
}

.btn-register{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#7367f0;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.btn-register:hover{
    background:#5e50ee;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    color:#7367f0;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="register-card">

<h2>Create Account</h2>

<form method="POST">

<div class="input-group">
<input type="text" name="username" placeholder="Username" required>
</div>

<div class="input-group">
<input type="email" name="email" placeholder="Email" required>
</div>

<div class="input-group">
<input type="password" name="password" placeholder="Password" required>
</div>

<button class="btn-register" type="submit">
Register
</button>

</form>

<div class="footer">
<a href="{{ url_for('auth.login') }}">
Back to Login
</a>
</div>

</div>

</body>
</html>
